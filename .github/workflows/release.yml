# Release Catalyst: on every pushed tag like v1.2.1, build the app, make the
# Bach setup file and publish it as a GitHub release. Installed apps update
# themselves from that release (see [updates] in bach.toml).
#
# To release: bump the version in package.json (and bach.toml), commit, then
#   git tag v1.2.1
#   git push origin v1.2.1

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # the Bach action publishes the GitHub release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app into dist/win-unpacked
        run: npm run build:unpack

      - name: Build and publish the Bach setup file
        uses: usebach/bach@v0
        with:
          config: bach.toml
          release: true
          # app-version defaults to "auto": the tag v1.2.1 gives app version 1.2.1.
