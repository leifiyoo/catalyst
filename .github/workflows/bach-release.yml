# Generated by Bach (`bach workflow`); run that again to update this file.
#
# One button releases your app: it raises the version everywhere it is
# written (bach.toml, package.json and its lock file, Cargo.toml, ...), builds
# the app and its Setup.exe, tags the release and publishes it on GitHub, so
# the installed apps update themselves.
#
# Start it on GitHub under Actions > Release > Run workflow, or from a terminal:
#
#   gh workflow run bach-release.yml -f bump=minor
#   gh workflow run bach-release.yml -f version=2.0.0
#   gh workflow run bach-release.yml -f bump=patch -f prerelease=true
#   gh workflow run bach-release.yml -f bump=patch -f dry_run=true
#
# The workflow commits "Release vX.Y.Z" to the branch it runs on. If that
# branch is protected, let github-actions[bot] push to it.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up (current keeps it, for a first release)
        type: choice
        options: [patch, minor, major, current]
        default: patch
      version:
        description: Or an exact version, like 2.0.0 (overrides the bump)
        type: string
        required: false
      notes:
        description: What's new, shown by apps that offer the update (default - GitHub's generated notes)
        type: string
        required: false
      prerelease:
        description: Mark it as a pre-release (installed apps don't update to it)
        type: boolean
        default: false
      draft:
        description: Save the release as a draft instead of publishing it
        type: boolean
        default: false
      latest:
        description: Make it GitHub's latest release (turn off for a fix to an older line)
        type: boolean
        default: true
      dry_run:
        description: Build everything, but don't commit, tag or publish
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time; a second one waits for the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the branch with its tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Build scripts run here, so the write token isn't left in
          # .git/config; only the push steps use it.
          persist-credentials: false

      - name: Install Bach
        uses: usebach/bach@v0

      - name: Raise the version everywhere
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          version=$(bach version "${EXACT:-$BUMP}" --config bach.toml)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Pick a higher version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: lts/*

      - name: Install dependencies
        shell: bash
        run: |
          log="$RUNNER_TEMP/install.log"
          if ! npm ci 2>&1 | tee "$log"; then
            if grep -Eq 'are in sync|Missing: .* from lock file|Invalid: lock file' "$log"; then
              echo "::warning::package.json and its lock file were out of sync. The lock file was brought up to date from package.json (nothing is upgraded beyond what package.json allows) and is committed with this release."
              npm install --package-lock-only --ignore-scripts
              npm ci
            else
              exit 1
            fi
          fi

      - name: Commit the release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only files that were already tracked: the new version, and a lock
          # file that had to be brought up to date. Build output stays out.
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Release v$VERSION"
          fi
          git tag -a "v$VERSION" -m "$VERSION"

      - name: Build your app
        shell: bash
        run: |
          npm run build --if-present
          npx electron-builder --win --dir

      - name: Push the release commit and its tag
        id: push
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The token goes in a one-off header, never into .git/config or a URL.
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/v$VERSION"; then
            echo "::error::Couldn't push the release commit. If $BRANCH is protected, let github-actions[bot] push to it; if it moved while this ran, run the workflow again."
            exit 1
          fi

      - name: Build the installer and publish the release
        id: bach
        uses: usebach/bach@v0
        with:
          version: local
          config: bach.toml
          app-version: ${{ steps.version.outputs.version }}
          release: ${{ !inputs.dry_run }}
          tag: v${{ steps.version.outputs.version }}
          prerelease: ${{ inputs.prerelease || contains(steps.version.outputs.version, '-') }}
          draft: ${{ inputs.draft }}
          latest: ${{ inputs.latest }}
          notes: ${{ inputs.notes }}
          # Sign the setup file before it is published (see docs/signing.md):
          # sign-command: signtool sign /fd sha256 /f cert.pfx /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 $env:BACH_SETUP_FILE

      - name: Keep the dry run's installer
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.bach.outputs.setup }}
            ${{ steps.bach.outputs.feed }}

      - name: Take the tag back if publishing failed
        if: ${{ failure() && steps.push.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push origin ":refs/tags/v$VERSION" || true
          echo "::warning::The release failed, so the tag v$VERSION was removed. The version files on the branch already say $VERSION: run the workflow again with bump=current to retry."
